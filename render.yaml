services:
  - type: web
    name: shoppal-otari
    branch: otari-hackathon
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:api --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SELLER_CHAT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: CURRENCY
        value: USD
      - key: OTARI_API_KEY
        sync: false
      - key: OTARI_BASE_URL
        value: https://api.otari.ai/api/v1
      - key: LLM_MODEL
        value: shoppal-chat   # Otari routing policy: gpt-oss-120b -> deepseek-v4-flash -> llama-3.3-70b
      - key: LLM_FALLBACK_MODELS
        value: openai/gpt-oss-120b,deepseek/deepseek-v4-flash,meta/llama-3.3-70b-instruct
      - key: GUARD_MODEL
        value: meta/llama-guard-4-12b
      - key: SCOUT_MODEL
        value: deepseek/deepseek-v4-flash
      - key: QUOTE_MODEL
        value: deepseek/deepseek-v4-flash
      - key: MCP_TOKEN
        generateValue: true
      - key: PER_CUSTOMER_DAILY_USD
        value: "0.05"
      - key: APP_DAILY_USD
        value: "0.50"
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: STORE_NAME
        value: Noor Boutique
