services:
  - type: web
    name: shoppal-otari
    branch: otari-hackathon
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:api --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SELLER_CHAT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: CURRENCY
        value: USD
      - key: OTARI_API_KEY
        sync: false
      - key: OTARI_BASE_URL
        value: https://api.otari.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: STORE_NAME
        value: Noor Boutique
